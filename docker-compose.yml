version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: razoragent_db
    ports:
      - "5433:5432" # map to host 5433 to avoid local default postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: on-failure
    volumes:
      - ./server:/usr/src/app:cached

volumes:
  pgdata:
